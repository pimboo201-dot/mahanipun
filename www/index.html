const nav=()=>`<nav class="np"><div class="row">${[["home","🏠 मुख्य"],["rep","📊 अहवाल"],["bk","💾 बॅकअप"],["about","ℹ️ About"],["priv","🔒 प्रायव्हसी पॉलिसी"],["rate","⭐ रेटिंग"]].map(a=>`<button class="${v.p==a[0]?"on":""}" onclick="go('${a[0]}')">${a[1]}</button>`).join("")}</div>${v.p=="home"?`<div class="row tabs">${M.map(m=>`<button class="${v.t==m[0]?"on":""}" onclick="v.t='${m[0]}';render()">${m[1]} ${m[2]}</button>`).join("")}</div>`:""}</nav>`;
function home(){const m=M.find(x=>x[0]==v.t);
const rows=S.st.map(s=>{const k=m[0]+s.g,N=LV[k],r=s.res[k];
return `<div class="row sp st"><div><b>${esc(s.n)}</b> <span class="badge">${G[s.g]}</span> <span class="m">⭐${s.pts||0}</span><br><span class="m">${r?"स्तर "+r+" / "+N+(s.dt[k]?" · "+s.dt[k]:""):"अजून तपासणी नाही"}</span></div><div class="row">${D[k]?`<button class="btn" onclick="start(${s.id})">परीक्षा</button>`:`<select onchange="setl(${s.id},'${k}',this.value)"><option value="">स्तर निवडा</option>${Array.from({length:N},(_,i)=>`<option value="${i+1}"${r==i+1?" selected":""}>${i+1}</option>`).join("")}</select>`}<button class="btn g" onclick="del(${s.id})">✕</button></div></div>`}).join("");
const note=S.st.some(s=>!D[m[0]+s.g])?`<p class="m">ज्या वर्गाचे प्रश्न अजून जोडले नाहीत तिथे परिशिष्ट ४ नुसार स्तर थेट निवडा.</p>`:"";
return `<div class="card"><h2>विद्यार्थी जोडा</h2><div class="row"><input id="nm" placeholder="विद्यार्थ्याचे नाव"><select id="gr" style="width:120px"><option value="35"${v.g!="2"?" selected":""}>${G["35"]}</option><option value="2"${v.g=="2"?" selected":""}>${G["2"]}</option></select><button class="btn" onclick="add()">+</button></div></div>
<div class="card"><h2>${m[1]} ${m[2]} (${S.st.length})</h2>${note}${rows||'<p class="m">वर विद्यार्थी जोडा.</p>'}</div>`}
function test(){const s=F(v.id),k=key(v.t,s),N=LV[k],d=D[k],i=v.i,ss=sets(k,i),q=ss[v.s],dn=z=>ss[z].every((_,j)=>v.ck[z]&&v.ck[z][j]),all=ss.some((_,z)=>dn(z)),cs=v.ck[v.s]||[];
return `<div class="card"><div class="row sp"><b>${esc(s.n)}</b><span class="badge">स्तर ${i+1} / ${N}</span></div><div class="bar"><b style="width:${(i+1)/N*100}%"></b></div>${v.msg?`<p style="color:var(--ok);font-weight:700;margin:0">${v.msg}</p>`:""}<h2>${d.t[i]}</h2><p class="m">प्रत्येक योग्य उत्तरावर टॅप करा. कोणताही एक संच पूर्ण बरोबर असेल तर पास.</p>${ss.length>1?`<div class="sets">${ss.map((_,z)=>`<button class="${z==v.s?"on ":""}${dn(z)?"dn":""}" onclick="v.s=${z};render()">${z+1}</button>`).join("")}</div>`:""}${q.map((t,j)=>`<div class="q${cs[j]?" on":""}${v.big?" bg":""}" onclick="tg(${j})"><i>${cs[j]?"✓":""}</i>${t}</div>`).join("")}
<div class="row" style="margin-top:12px"><button class="btn no" style="flex:1" onclick="fl()">नापास – थांबा</button><button class="btn ok" style="flex:1" ${all?"":"disabled"} onclick="pass()">${i==N-1?"पास → पूर्ण":"पास → पुढे"}</button></div></div>
<div class="row"><button class="btn g" onclick="go('home')">← मुख्य</button>${i>1?`<button class="btn g" onclick="back()">‹ मागील स्तर</button>`:""}<button class="btn g" onclick="v.big=!v.big;render()">👁 मोठे अक्षर</button></div>`}
function res(){const s=F(v.id),k=key(v.t,s),N=LV[k],r=s.res[k],d=D[k];
return `<div class="card"><h2 style="text-align:center">${esc(s.n)} – निकाल</h2><div class="big">${r} / ${N}</div><p style="text-align:center"><b>${d.t[r-1]}</b></p>${r<N?`<p class="m" style="text-align:center">पुढील ध्येय (स्तर ${r+1}): ${d.t[r]}</p>`:""}${v.msg?`<p style="text-align:center;color:var(--ok);font-weight:700">${v.msg}</p>`:""}<p class="m" style="text-align:center">⭐ एकूण: ${s.pts||0}</p></div><div class="row np"><button class="btn" style="flex:1" onclick="go('home')">पूर्ण</button>${v.rd?"":`<button class="btn g" style="flex:1" onclick="rw()">📺 जाहिरात पाहा +२ ⭐</button>`}</div>`}
function rep(){return `<div class="card"><h2>📊 अहवाल – अध्ययन स्तर (परिशिष्ट ४)</h2><div style="overflow-x:auto"><table><tr><th>अ.क्र.</th><th>नाव</th><th>वर्ग</th>${M.map(m=>`<th>${m[2]}</th>`).join("")}<th>तारीख</th></tr>${S.st.map((s,j)=>`<tr><td>${j+1}</td><td>${esc(s.n)}</td><td>${G[s.g]}</td>${M.map(m=>{const k=m[0]+s.g,r=s.res[k];return `<td>${r?r+"/"+LV[k]:"-"}</td>`}).join("")}<td>${last(s)||"-"}</td></tr>`).join("")}</table></div></div><div class="row np"><button class="btn" onclick="print()">🖨 प्रिंट</button></div>`}
function tsv(){return [["नाव","वर्ग",...M.map(m=>m[2]),"तारीख"].join("\t")].concat(S.st.map(s=>[s.n.replace(/\s+/g," "),G[s.g],...M.map(m=>s.res[m[0]+s.g]||""),last(s)].join("\t"))).join("\n")}
function bk(){return `<div class="card"><h2>📋 Excel साठी कॉपी</h2><textarea id="tv" readonly rows="5">${esc(tsv())}</textarea><button class="btn" onclick="cp('tv')">कॉपी</button></div><div class="card"><h2>💾 बॅकअप</h2><textarea id="bj" readonly rows="4">${esc(JSON.stringify(S))}</textarea><button class="btn" onclick="cp('bj')">कॉपी करून सुरक्षित ठेवा</button></div><div class="card"><h2>⬆ बॅकअप परत आणा</h2><textarea id="im" rows="4" placeholder="येथे बॅकअप पेस्ट करा"></textarea><button class="btn" onclick="imp()">परत आणा</button></div>`}

const APP="महानिपुण विद्यार्थी स्तर पडताळणी",PKG=(window.ADCFG||{}).pkg||"com.yourname.mahanipun",DEV=(window.ADCFG||{}).dev||"विकसक",MAIL=(window.ADCFG||{}).mail||"you@example.com",VER="1.0",PD="०६-१०-२०२६";

<p>शिक्षकांसाठी बनवलेले साधे ॲप. इयत्ता २ री व ३/४/५ चे विद्यार्थी वाचन, लेखन, संख्याज्ञान व संख्यांवरील क्रिया यांमध्ये कोणत्या अध्ययन स्तरावर आहेत हे तपासण्यासाठी प्रश्नसंच देते व निकालाचा अहवाल बनवते.</p>
<h3>वैशिष्ट्ये</h3><ul><li>विद्यार्थीनिहाय स्तर पडताळणी व ⭐ गुण</li><li>अहवाल तक्ता, प्रिंट व Excel साठी कॉपी</li><li>मुख्य सुविधा इंटरनेटशिवाय चालतात (जाहिरातींसाठी इंटरनेट लागते); विद्यार्थ्यांचा डेटा फक्त तुमच्या फोनमध्ये</li><li>बॅकअप / परत आणा सुविधा</li></ul>
<h3>सूचना</h3><p class="m">हे ॲप शासनाचे अधिकृत ॲप नाही व कोणत्याही शासकीय विभागाशी संलग्न नाही. अध्ययन स्तरांचे वर्णन शैक्षणिक वापरासाठी शासकीय मार्गदर्शनावर आधारित आहे. अंतिम नोंदी शासनाच्या अधिकृत परिशिष्टांनुसार तपासा.</p>
<h3>संपर्क</h3><p><a href="mailto:${MAIL}">${MAIL}</a></p></div>`}
function priv(){return `<div class="card pv"><h2>🔒 प्रायव्हसी पॉलिसी</h2><p class="m">अद्ययावत: ${PD}</p>
<h3>१. आम्ही कोणती माहिती गोळा करतो?</h3><p>आम्ही स्वतः कोणतीही वैयक्तिक माहिती गोळा करत नाही. खाते / लॉगिन नाही.</p>
<h3>२. तुम्ही भरलेली माहिती</h3><p>विद्यार्थ्यांची नावे, वर्ग, स्तर निकाल व ⭐ गुण हे फक्त तुमच्या उपकरणात (ब्राउझर/ॲप स्टोरेज) साठवले जातात. ती आमच्या सर्व्हरवर पाठवली जात नाही.</p>
<h3>३. शेअरिंग</h3><p>आम्ही कोणाशीही माहिती विकत नाही किंवा शेअर करत नाही. बॅकअप कॉपी, प्रिंट किंवा Excel कॉपी तुम्ही स्वतः केल्यासच बाहेर जाते.</p>
<h3>४. मुलांची माहिती</h3><p>हे ॲप शिक्षक / पालकांसाठी आहे. मुलांचा कोणताही डेटा विकसकाकडे येत नाही. शक्यतो विद्यार्थ्यांची पूर्ण नावे ऐवजी पहिले नाव / क्रमांक वापरावा.</p>
<h3>५. डेटा हटवणे</h3><p>एखादा विद्यार्थी ✕ दाबून काढा, किंवा फोनच्या सेटिंगमधून ॲपचा डेटा / कॅशे साफ करा; सर्व माहिती कायमची हटते.</p>
<h3>६. जाहिराती व तृतीय पक्ष</h3><p>हे ॲप Google AdMob च्या जाहिराती दाखवते. AdMob जाहिरातींसाठी जाहिरात ओळख क्रमांक (Advertising ID), डिव्हाइस माहिती व अंदाजे स्थान गोळा करू शकते. विद्यार्थ्यांची नावे, वर्ग किंवा निकाल जाहिरात प्रदात्याला पाठवले जात नाहीत. तपशील: policies.google.com/technologies/partner-sites. काही प्रदेशांत जाहिरातींसाठी संमती विचारली जाते.</p>
<h3>७. बदल व संपर्क</h3><p>धोरणात बदल झाल्यास येथे प्रसिद्ध केले जातील. प्रश्नांसाठी: <a href="mailto:${MAIL}">${MAIL}</a></p></div>`}
function setR(n){S.rate=n;save();render()}
function rate(){const r=S.rate||0;return `<div class="card pv" style="text-align:center"><h2>⭐ ॲपला रेटिंग द्या</h2><p class="m">ॲप आवडला असेल तर रेटिंग द्या, तुमचा अभिप्राय आम्हाला सुधारणा करण्यास मदत करतो.</p>
<div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="setR(${n})">${n<=r?"★":"☆"}</button>`).join("")}</div>

<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><button class="btn" onclick="location.href='${PLAY}'">Play Store वर रेटिंग द्या</button>
<button class="btn g" onclick="location.href='mailto:${MAIL}?subject='+encodeURIComponent('${APP} अभिप्राय')+'&body='+encodeURIComponent('रेटिंग: '+(S.rate||'-')+'/5%0A')">✉️ अभिप्राय पाठवा</button></div></div>`}
function render(){$("nv").innerHTML=v.p=="test"?"":nav();$("app").innerHTML=({home,test,res,rep,bk,about,priv,rate})[v.p]()+(v.p=="test"?"":adb());scrollTo(0,0);adSync()}
